[project]
name = "prism-voice"
version = "0.1.0"
description = "Motores de voz de PRISM (Whisper + Kokoro por defecto). Este mismo entorno ejecuta tambien el puente de la Fase 4 (bridge/server.py) -- comparte proceso con la voz a proposito, para no instalar torch/whisper dos veces en dos venvs separados."
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "kokoro>=0.9.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "claude-agent-sdk>=0.2.100",
    "sounddevice>=0.5.0",
    "webrtcvad>=2.0.10",
    "setuptools<81",  # webrtcvad imports pkg_resources at runtime, not in Python's stdlib
]

[tool.setuptools]
packages = ["engines"]

[tool.uv]
package = false
