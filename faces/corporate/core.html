<title>Prism Core</title>
<style>
  :root {
    --bg: #0a0b10;
    --surface: #14161f;
    --surface-2: #1b1e2a;
    --surface-border: #262a3a;
    --text: #eaebf2;
    --text-muted: #8d93a6;
    --text-faint: #767d98;
    --violet: #8b7cff;
    --blue: #4ea8ff;
    --teal: #35d6c0;
    --amber: #ffc24b;
    --rose: #ff6f91;
    --accent: var(--blue);
    --danger: #ff6f6f;
    --font-display: "Unbounded", "Segoe UI", sans-serif;
    --font-body: "Instrument Sans", "Segoe UI", sans-serif;
    --font-mono: "Spline Sans Mono", "SF Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- top bar ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--surface-border);
    flex-shrink: 0;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.06em;
  }

  .wordmark .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--violet), var(--blue), var(--teal));
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 100px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
  }

  .status-pill .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background 0.3s, box-shadow 0.3s;
  }

  body[data-state="listening"] .status-pill .led { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  body[data-state="thinking"] .status-pill .led { background: var(--violet); box-shadow: 0 0 8px var(--violet); }
  body[data-state="speaking"] .status-pill .led { background: var(--blue); box-shadow: 0 0 8px var(--blue); }

  .mode-switch {
    display: flex;
    gap: 3px;
    padding: 3px;
    border-radius: 11px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
  }

  .mode-switch button {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 7px 13px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .mode-switch button:hover { color: var(--text); }

  .mode-switch button.active {
    background: var(--surface-2);
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--surface-border);
  }

  /* ---------- main stage ---------- */

  .stage {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .core-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: flex-basis 0.4s ease;
  }

  canvas#core {
    width: min(360px, 70vw);
    height: min(360px, 70vw);
    transition: width 0.4s ease, height 0.4s ease;
  }

  body[data-mode="text"] .core-wrap {
    flex: 0 0 auto;
    padding: 14px 0 0;
  }

  body[data-mode="text"] canvas#core {
    width: 64px;
    height: 64px;
  }

  .caption {
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    padding-bottom: 6px;
    min-height: 20px;
    transition: opacity 0.2s;
  }

  body[data-mode="text"] .caption { display: none; }

  /* ---------- chat transcript (text mode) ---------- */

  .transcript {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 12px;
  }

  body[data-mode="text"] .transcript { display: flex; flex-direction: column; }

  .transcript-inner {
    width: min(640px, 92vw);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 10px 0 20px;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 86%;
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  .msg .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.assistant .avatar {
    background: conic-gradient(from 180deg, var(--violet), var(--blue), var(--teal), var(--amber), var(--rose), var(--violet));
  }

  .msg.user .avatar {
    background: var(--surface-2);
    border: 1px solid var(--surface-border);
  }

  .bubble {
    font-size: 14.5px;
    line-height: 1.5;
    padding: 10px 14px;
    border-radius: 14px;
  }

  .msg.user .bubble {
    background: var(--surface-2);
    border: 1px solid var(--surface-border);
    border-top-right-radius: 4px;
  }

  .msg.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-top-left-radius: 4px;
  }

  .msg.assistant .bubble p { margin: 0 0 8px; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }

  /* -- collapsible "ver cambios" card -- */

  .change-card {
    margin-top: 10px;
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
  }

  .change-summary {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    cursor: pointer;
    user-select: none;
    background: var(--surface-2);
  }

  .change-summary .file-icon {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--teal);
    background: rgba(53, 214, 192, 0.12);
    border-radius: 5px;
    padding: 2px 6px;
  }

  .change-summary .file-name {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text);
    flex: 1;
  }

  .change-summary .stat-add { color: var(--teal); font-family: var(--font-mono); font-size: 12px; }
  .change-summary .stat-del { color: var(--rose); font-family: var(--font-mono); font-size: 12px; margin-left: 6px; }

  .change-summary .chevron {
    color: var(--text-muted);
    font-size: 11px;
    transition: transform 0.2s;
  }

  .change-card.open .chevron { transform: rotate(90deg); }

  .change-diff {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }

  .change-card.open .change-diff { max-height: 340px; overflow-y: auto; }

  .change-diff pre {
    margin: 0;
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
  }

  .diff-line { display: block; white-space: pre; }
  .diff-add { background: rgba(53, 214, 192, 0.08); color: #a9f2e6; }
  .diff-del { background: rgba(255, 111, 145, 0.08); color: #ffc2d1; }
  .diff-ctx { color: var(--text-faint); }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
  }

  .typing-indicator span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-faint);
    animation: bounce 1.1s infinite ease-in-out;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  /* ---------- bottom control bar ---------- */

  .controls {
    flex-shrink: 0;
    padding: 16px 20px 22px;
    border-top: 1px solid var(--surface-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .controls-inner {
    width: min(640px, 92vw);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* push-to-talk control */

  .ptt-hint {
    flex: 1;
    text-align: center;
    color: var(--text-muted);
    font-size: 12.5px;
  }

  .ptt-hint kbd {
    font-family: var(--font-mono);
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
    color: var(--text);
  }

  .talk-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--text);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    flex-shrink: 0;
  }

  .talk-btn:active,
  .talk-btn.engaged {
    background: var(--surface-2);
    box-shadow: 0 0 0 6px rgba(78, 168, 255, 0.12);
    transform: scale(0.97);
  }

  /* live conversation control */

  body[data-mode="live"] .controls-inner { justify-content: center; }

  .live-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 100px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .live-btn.active {
    background: rgba(255, 111, 111, 0.1);
    border-color: rgba(255, 111, 111, 0.4);
    color: #ffb3b3;
  }

  .live-btn .rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
  }

  .live-btn.active .rec-dot {
    background: var(--danger);
    animation: pulse-dot 1.4s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* text input control */

  .text-input-row {
    display: none;
    width: 100%;
    align-items: flex-end;
    gap: 10px;
  }

  body[data-mode="text"] .text-input-row { display: flex; }
  body[data-mode="text"] .controls-inner { display: contents; }

  .text-input-row textarea {
    flex: 1;
    resize: none;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14.5px;
    padding: 11px 14px;
    line-height: 1.4;
    max-height: 120px;
    outline: none;
  }

  .text-input-row textarea:focus { border-color: var(--accent); }
  .text-input-row textarea::placeholder { color: var(--text-faint); }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #061018;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }

  .send-btn:disabled { opacity: 0.35; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>

<div class="topbar">
  <div class="wordmark"><span class="dot"></span>PRISM</div>
  <div class="status-pill"><span class="led"></span><span id="status-label">inactivo</span></div>
  <div class="mode-switch" role="tablist">
    <button data-mode="ptt" class="active">Mantener para hablar</button>
    <button data-mode="live">Conversación en vivo</button>
    <button data-mode="text">Escribir</button>
  </div>
</div>

<div class="stage">
  <div class="core-wrap">
    <canvas id="core" width="360" height="360"></canvas>
  </div>
  <div class="caption" id="caption">Mantén pulsado el botón, o la barra espaciadora, para hablar.</div>

  <div class="transcript">
    <div class="transcript-inner" id="transcript-inner"></div>
  </div>
</div>

<div class="controls">
  <div class="controls-inner" id="controls-inner">
    <div class="ptt-hint" id="ptt-only">Mantén pulsada la <kbd>barra espaciadora</kbd> o el botón para hablar</div>
    <button class="talk-btn" id="talk-btn" aria-label="Mantener para hablar">&#127908;</button>

    <button class="live-btn" id="live-btn" style="display:none">
      <span class="rec-dot"></span>
      <span id="live-btn-label">Iniciar conversación</span>
    </button>

    <div class="text-input-row" id="text-row">
      <textarea id="text-input" rows="1" placeholder="Escribe a tu asistente..."></textarea>
      <button class="send-btn" id="send-btn" aria-label="Enviar">&#8593;</button>
    </div>
  </div>
</div>

<script>
(() => {
  const body = document.body;
  const canvas = document.getElementById('core');
  const ctx = canvas.getContext('2d');
  const captionEl = document.getElementById('caption');
  const statusLabel = document.getElementById('status-label');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------- core visualizer ----------------
  // A faceted prism core: five rotating light beams (one per PRISM letter),
  // idling as a slow drift, gathering inward while listening, scattering
  // while thinking, and pulsing outward in sync with speech while speaking.

  const HUES = ['#8b7cff', '#4ea8ff', '#35d6c0', '#ffc24b', '#ff6f91'];
  const HUES_RGB = HUES.map(hexToRgb);

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Samples a continuous point (0..1, wrapping) along the five-stop PRISM
  // spectrum, so any facet can land between two named hues instead of only
  // ever showing one of the five flat colors.
  function spectrumColor(pos) {
    const n = HUES_RGB.length;
    const scaled = pos * n;
    const i = Math.floor(scaled) % n;
    const j = (i + 1) % n;
    const f = scaled - Math.floor(scaled);
    const a = HUES_RGB[i], b = HUES_RGB[j];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }

  // Irregular gem outline: [angle in degrees, radius multiplier]. Asymmetric
  // on purpose (a sharp top point, an uneven "girdle", a shorter base) —
  // a real cut stone, not a regular polygon.
  const GEM_POINTS = [
    [-90, 1.00], [-50, 0.58], [-10, 0.90], [30, 0.64],
    [70, 0.98], [110, 0.56], [150, 0.84], [190, 0.62], [230, 0.92],
  ];
  let state = 'idle';
  let t = 0;
  let speakLevel = 0;
  let speakTarget = 0;

  function resizeCanvas() {
    const size = Math.round(canvas.getBoundingClientRect().width * (window.devicePixelRatio || 1));
    if (canvas.width !== size) { canvas.width = size; canvas.height = size; }
  }
  window.addEventListener('resize', resizeCanvas);

  function draw() {
    resizeCanvas();
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2;
    const baseR = w * 0.16;

    ctx.clearRect(0, 0, w, h);

    // ambient backdrop glow
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.5);
    bg.addColorStop(0, 'rgba(78,168,255,0.05)');
    bg.addColorStop(1, 'rgba(10,11,16,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const speed = state === 'thinking' ? 0.045 : state === 'listening' ? 0.018 : state === 'speaking' ? 0.026 : 0.008;
    t += reduceMotion ? speed * 0.15 : speed;

    // speech energy: ease toward a pseudo-random target to fake a waveform
    if (state === 'speaking') {
      speakTarget += (Math.random() - 0.5) * 0.6;
      speakTarget = Math.max(0.15, Math.min(1, speakTarget));
    } else {
      speakTarget = 0;
    }
    speakLevel += (speakTarget - speakLevel) * 0.15;

    let spread = baseR * 1.35;      // distance of beams from center
    let coreScale = 1;
    if (state === 'listening') spread = baseR * (0.9 + Math.sin(t * 3) * 0.08);
    if (state === 'thinking') spread = baseR * (1.5 + Math.sin(t * 5) * 0.35);
    if (state === 'speaking') { spread = baseR * (1.1 + speakLevel * 0.6); coreScale = 1 + speakLevel * 0.12; }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < HUES.length; i++) {
      const angle = t * (state === 'thinking' ? 1.4 : 0.5) + (i / HUES.length) * Math.PI * 2;
      const bx = cx + Math.cos(angle) * spread;
      const by = cy + Math.sin(angle) * spread;
      const r = baseR * (0.62 + (state === 'speaking' ? speakLevel * 0.25 : 0));
      const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      grad.addColorStop(0, HUES[i] + 'cc');
      grad.addColorStop(1, HUES[i] + '00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // faceted gem core — irregular cut, each facet sampling a moving point
    // along the PRISM spectrum, so the whole gem shifts color as it turns,
    // the way a real cut stone shifts color as light crosses its faces.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.3);
    ctx.scale(coreScale, coreScale);
    const coreR = baseR * 0.68;
    const boundary = GEM_POINTS.map(([deg, rMul]) => {
      const a = (deg * Math.PI) / 180;
      return [Math.cos(a) * coreR * rMul, Math.sin(a) * coreR * rMul];
    });
    const center = [0, -coreR * 0.12]; // slightly high, like a gem's table

    const hueSpeed = state === 'thinking' ? 0.09 : 0.03;
    const lightAngle = t * (state === 'thinking' ? 0.6 : 0.22);

    for (let i = 0; i < boundary.length; i++) {
      const [ax, ay] = boundary[i];
      const [bx, by] = boundary[(i + 1) % boundary.length];
      const facetAngle = Math.atan2((ay + by) / 2 - center[1], (ax + bx) / 2 - center[0]);
      const lightDot = Math.cos(facetAngle - lightAngle); // -1..1, simulates a moving light source
      const pos = (((i / boundary.length) + t * hueSpeed) % 1 + 1) % 1;
      const [r, g, b] = spectrumColor(pos);
      const shade = 0.55 + lightDot * 0.3 + (state === 'speaking' ? speakLevel * 0.15 : 0);

      ctx.beginPath();
      ctx.moveTo(center[0], center[1]);
      ctx.lineTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.closePath();
      ctx.fillStyle = `rgba(${Math.round(r * shade)},${Math.round(g * shade)},${Math.round(b * shade)},0.92)`;
      ctx.fill();
      ctx.strokeStyle = 'rgba(10,11,16,0.35)';
      ctx.lineWidth = w * 0.0012;
      ctx.stroke();
    }

    // glass rim + a thin moving glint to sell "catching the light"
    ctx.beginPath();
    boundary.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
    ctx.closePath();
    ctx.lineWidth = w * 0.0035;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.stroke();

    const glintAngle = -t * 0.9;
    const glintX = Math.cos(glintAngle) * coreR * 0.5;
    const glintY = center[1] + Math.sin(glintAngle) * coreR * 0.5;
    const glint = ctx.createRadialGradient(glintX, glintY, 0, glintX, glintY, coreR * 0.55);
    glint.addColorStop(0, 'rgba(255,255,255,0.35)');
    glint.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = glint;
    ctx.beginPath();
    boundary.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---------------- state + captions ----------------

  const STATE_LABEL = { idle: 'inactivo', listening: 'escuchando', thinking: 'pensando', speaking: 'hablando' };
  const CAPTIONS = {
    ptt: {
      idle: 'Mantén pulsado el botón, o la barra espaciadora, para hablar.',
      listening: 'Escuchando...',
      thinking: 'Pensando...',
      speaking: 'Respondiendo...',
    },
    live: {
      idle: 'Pulsa "Iniciar conversación" para hablar sin soltar ningún botón.',
      listening: 'Escuchando — habla cuando quieras, sin pulsar nada.',
      thinking: 'Pensando...',
      speaking: 'Respondiendo...',
    },
  };

  function setState(next) {
    state = next;
    body.setAttribute('data-state', next);
    statusLabel.textContent = STATE_LABEL[next];
    const mode = body.getAttribute('data-mode');
    if (CAPTIONS[mode]) captionEl.textContent = CAPTIONS[mode][next];
  }
  setState('idle');

  // ---------------- mode switching ----------------

  const modeButtons = document.querySelectorAll('.mode-switch button');
  const pttOnly = document.getElementById('ptt-only');
  const talkBtn = document.getElementById('talk-btn');
  const liveBtn = document.getElementById('live-btn');

  function setMode(mode) {
    body.setAttribute('data-mode', mode);
    modeButtons.forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
    pttOnly.style.display = mode === 'ptt' ? '' : 'none';
    talkBtn.style.display = mode === 'ptt' ? '' : 'none';
    liveBtn.style.display = mode === 'live' ? '' : 'none';
    setState('idle');
    if (mode === 'live' && liveActive) stopLive();
  }

  modeButtons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // ---------------- push to talk demo ----------------

  let pttTimer = null;

  function engagePtt() {
    if (body.getAttribute('data-mode') !== 'ptt') return;
    talkBtn.classList.add('engaged');
    setState('listening');
  }

  function releasePtt() {
    if (body.getAttribute('data-mode') !== 'ptt') return;
    talkBtn.classList.remove('engaged');
    if (state !== 'listening') return;
    setState('thinking');
    clearTimeout(pttTimer);
    pttTimer = setTimeout(() => {
      setState('speaking');
      pttTimer = setTimeout(() => setState('idle'), 2200);
    }, 900);
  }

  talkBtn.addEventListener('mousedown', engagePtt);
  talkBtn.addEventListener('mouseup', releasePtt);
  talkBtn.addEventListener('mouseleave', () => talkBtn.classList.contains('engaged') && releasePtt());
  talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); engagePtt(); });
  talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); releasePtt(); });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && body.getAttribute('data-mode') === 'ptt' && !e.repeat) {
      e.preventDefault();
      engagePtt();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && body.getAttribute('data-mode') === 'ptt') {
      e.preventDefault();
      releasePtt();
    }
  });

  // ---------------- live conversation demo ----------------

  let liveActive = false;
  let liveTimer = null;

  function liveCycle() {
    setState('listening');
    liveTimer = setTimeout(() => {
      setState('thinking');
      liveTimer = setTimeout(() => {
        setState('speaking');
        liveTimer = setTimeout(liveCycle, 2000);
      }, 800);
    }, 2600);
  }

  function startLive() {
    liveActive = true;
    liveBtn.classList.add('active');
    document.getElementById('live-btn-label').textContent = 'Terminar conversación';
    liveCycle();
  }

  function stopLive() {
    liveActive = false;
    clearTimeout(liveTimer);
    liveBtn.classList.remove('active');
    document.getElementById('live-btn-label').textContent = 'Iniciar conversación';
    setState('idle');
  }

  liveBtn.addEventListener('click', () => (liveActive ? stopLive() : startLive()));

  // ---------------- text chat demo ----------------

  const transcriptInner = document.getElementById('transcript-inner');
  const textInput = document.getElementById('text-input');
  const sendBtn = document.getElementById('send-btn');

  function scrollToBottom() {
    const t = document.querySelector('.transcript');
    t.scrollTop = t.scrollHeight;
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'msg user';
    msg.innerHTML = `<div class="avatar"></div><div class="bubble"></div>`;
    msg.querySelector('.bubble').textContent = text;
    transcriptInner.appendChild(msg);
    scrollToBottom();
  }

  function addAssistantMessage({ text, change }) {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const p = document.createElement('p');
    p.textContent = text;
    bubble.appendChild(p);

    if (change) {
      const card = document.createElement('div');
      card.className = 'change-card';
      card.innerHTML = `
        <div class="change-summary">
          <span class="file-icon">TSX</span>
          <span class="file-name">${change.file}</span>
          <span class="stat-add">+${change.added}</span>
          <span class="stat-del">-${change.removed}</span>
          <span class="chevron">&#9656;</span>
        </div>
        <div class="change-diff"><pre>${change.diff}</pre></div>
      `;
      card.querySelector('.change-summary').addEventListener('click', () => card.classList.toggle('open'));
      bubble.appendChild(card);
    }

    msg.innerHTML = `<div class="avatar"></div>`;
    msg.appendChild(bubble);
    transcriptInner.appendChild(msg);
    scrollToBottom();
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.id = 'typing-msg';
    msg.innerHTML = `<div class="avatar"></div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
    transcriptInner.appendChild(msg);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-msg');
    if (el) el.remove();
  }

  const DIFF = [
    ['ctx', '  export default function NavBar() {'],
    ['add', '+   const [open, setOpen] = useState(false);'],
    ['ctx', ''],
    ['ctx', '    return ('],
    ['ctx', '      <header ...>'],
    ['del', '-       <nav className="hidden gap-8 ... md:flex">'],
    ['add', '+       <nav className="hidden gap-8 ... md:flex">'],
    ['ctx', '          {links.map(...)}'],
    ['ctx', '        </nav>'],
    ['add', '+       <button className="... md:hidden" onClick={() => setOpen(v => !v)}>'],
    ['add', '+         {/* icono de hamburguesa */}'],
    ['add', '+       </button>'],
  ].map(([type, line]) => `<span class="diff-line diff-${type}">${line}</span>`).join('');

  function respondTo(userText) {
    addTyping();
    setTimeout(() => {
      removeTyping();
      const lower = userText.toLowerCase();
      if (lower.includes('móvil') || lower.includes('menu') || lower.includes('menú')) {
        addAssistantMessage({
          text: 'Arreglado — el menú no tenía botón en móvil. Añadí una hamburguesa que despliega los mismos enlaces, sin tocar el de escritorio.',
          change: { file: 'src/components/NavBar.tsx', added: 9, removed: 1, diff: DIFF },
        });
      } else {
        addAssistantMessage({
          text: 'Anotado. ¿Quieres que lo haga ya, o prefieres revisarlo primero?',
        });
      }
    }, 1100);
  }

  function sendText() {
    const value = textInput.value.trim();
    if (!value) return;
    addUserMessage(value);
    textInput.value = '';
    textInput.style.height = 'auto';
    respondTo(value);
  }

  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });
  textInput.addEventListener('input', () => {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(120, textInput.scrollHeight) + 'px';
  });

  // seed the transcript with one real exchange so the demo opens populated
  addUserMessage('Arregla el menú móvil de mi web personal, no hay forma de navegar');
  addAssistantMessage({
    text: 'Confirmado — el <nav> tenía la clase "hidden md:flex", invisible en móvil sin ningún botón que lo sustituyera. Añadido un botón de hamburguesa que despliega los mismos enlaces.',
    change: { file: 'src/components/NavBar.tsx', added: 9, removed: 1, diff: DIFF },
  });
})();
</script>
